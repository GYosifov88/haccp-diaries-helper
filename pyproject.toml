[project]
name = "haccp-diaries-helper"
version = "0.1.0"
description = "HACCP food-safety diary assistant powered by LangGraph and Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "python-telegram-bot>=21.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
haccp-bot = "haccp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["haccp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
